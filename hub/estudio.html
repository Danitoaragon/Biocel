<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estudio de Biología Celular</title>
<script>try{const t=localStorage.getItem("bc-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&family=DM+Sans:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
:root{--hdr:#1B3FD0;--acc:#1B3FD0;--acc2:#1430a8;--paper:#fff;--fig:#fffdf9;--rowalt:#faf6ec;--hov:#f7f9ff;--selbg:#eef2fd;--lcob2:#d4def9;--bookink:#1f2338;--leadc:#2a3150;--boldink:#14204f;--bxo:#fff4d9;--bxoc:#8a6312;--bxe:#f3ecfb;--bxec:#6b3fb8;--bxp:#fff7ef;--bxpc:#c4621a;--d1b:#e3f2ea;--d1c:#1f6a48;--d2b:#fff1cc;--d2c:#7a5a0a;--d3b:#f9e3dd;--d3c:#9b3424;--okb:#9fd1b8;--badb:#eab4a8;--whyb:rgba(255,255,255,.65);--rbar:rgba(245,240,228,.96);--bfs:18.5px;--cob:#1B3FD0;--cob2:#1430a8;--cream:#F5F0E4;--ocre:#E8B94B;--ink:#1d2340;--mut:#5a5f78;--card:#fffdf7;--line:#d9d1bd;--soft:#efe8d8;--ok:#2f7d5b;--okbg:#e3f2ea;--bad:#b8412e;--badbg:#f9e3dd;--lcob:#e6ecfb;color-scheme:light}
*{box-sizing:border-box}
html{background:var(--cream)}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",Inter,system-ui,sans-serif;font-size:16px;line-height:1.5}
a{color:var(--acc)}
button{font:inherit}
.top{position:sticky;top:0;z-index:30;background:var(--hdr);color:var(--cream);box-shadow:0 2px 10px rgba(20,30,80,.18)}
.top .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;font-size:26px;color:var(--cream);text-decoration:none;margin-right:auto;white-space:nowrap}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav a{color:var(--cream);text-decoration:none;font-weight:600;font-size:14px;padding:7px 11px;border-radius:9px;white-space:nowrap}
.nav a:hover,.nav a.on{background:rgba(245,240,228,.16)}
.nav a.home{background:var(--ocre);color:var(--ink)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;text-align:center;margin-left:4px}
#pbar{position:fixed;left:0;top:0;height:4px;background:var(--ocre);z-index:40;width:0;transition:width .15s}
main{max-width:1240px;margin:0 auto;padding:26px 16px 70px}
h1.pt{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(34px,5vw,52px);color:var(--acc);margin:4px 0 8px;line-height:1.05}
.kick{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--mut)}
.lead2{color:var(--mut);font-size:17px;margin:0 0 22px;max-width:760px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:8px}
.card h2{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:34px;color:var(--acc);margin:0;line-height:1.05}
.card p{margin:0;color:var(--ink)}
.card .meta{font-size:14px;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:10px 15px;background:var(--cob);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;font-size:15px}
.btn:hover{background:var(--cob2)}
.btn.sec{background:var(--lcob);color:var(--acc)}
.btn.sec:hover{background:var(--lcob2)}
.btn.ghost{background:transparent;color:var(--acc);border:2px solid var(--line)}
.btn.warn{background:var(--badbg);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.opt:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ocre);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink);text-decoration:none}
.chip.on{background:var(--cob);color:#fff;border-color:var(--acc)}
.pbar2{height:8px;background:var(--soft);border-radius:6px;overflow:hidden}.pbar2 i{display:block;height:100%;background:var(--ok);border-radius:6px}
/* ===== LIBRO ===== */
.reader{display:grid;grid-template-columns:205px minmax(0,1fr);gap:26px;align-items:start}.reader.noside{grid-template-columns:minmax(0,1fr)}.reader.noside .toc{display:none}.reader.noside article.book{margin:0 auto}.reader>*{min-width:0}details.toc-m,.toc{overflow-wrap:anywhere}.readbar{flex-wrap:wrap}
.toc{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 6px}
.toc h4{margin:0 0 6px 8px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.toc ol{margin:0;padding-left:24px}.toc li{margin:2px 0;font-size:13px;line-height:1.35}
.toc a{text-decoration:none;color:var(--ink)}.toc a.on{color:var(--acc);font-weight:700}
.toc ul{margin:2px 0 6px;padding-left:12px;list-style:none}.toc ul li{font-size:11.5px;margin:1px 0}.toc ul a{color:var(--mut)}
.toc .done::after{content:" ✓";color:var(--ok);font-weight:700}
details.toc-m{display:none;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:16px}
details.toc-m summary{font-weight:700;cursor:pointer;color:var(--acc)}
article.book{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(20px,4vw,48px);font-family:"Source Serif 4",Georgia,serif;font-size:var(--bfs);line-height:1.75;color:var(--bookink);max-width:900px}
article.book .crumb{font-family:"DM Sans",sans-serif;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:700}
article.book h2{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(36px,5vw,48px);color:var(--acc);margin:4px 0 18px;line-height:1.05}
article.book h3{font-family:"DM Sans",sans-serif;font-size:22px;color:var(--acc);margin:34px 0 10px;padding-top:6px;border-top:2px solid var(--soft)}
article.book h4{font-family:"DM Sans",sans-serif;font-size:18px;color:var(--ink);margin:24px 0 6px}
article.book p{margin:0 0 14px}
article.book p.lead{font-size:20px;color:var(--leadc)}
article.book ul,article.book ol{padding-left:24px;margin:0 0 14px}article.book li{margin:5px 0}
article.book b{color:var(--boldink)}
article.book ul.hy li{margin:8px 0}
table.cmp{width:100%;border-collapse:collapse;margin:16px 0 22px;font-family:"DM Sans",sans-serif;font-size:15px;line-height:1.4}
table.cmp th{background:var(--cob);color:#fff;text-align:left;padding:9px 10px}
table.cmp td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top}
table.cmp tr:nth-child(even) td{background:var(--rowalt)}
table.cmp td:first-child{font-weight:700;color:var(--acc2)}
.tw{overflow-x:auto}
.box{border-radius:12px;padding:14px 18px;margin:18px 0;font-family:"DM Sans",sans-serif;font-size:16px;line-height:1.55}
.box>b:first-child{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
.box.concepto{background:var(--lcob);border-left:5px solid var(--cob)}.box.concepto>b:first-child{color:var(--acc)}
.box.ojo{background:var(--bxo);border-left:5px solid var(--ocre)}.box.ojo>b:first-child{color:var(--bxoc)}
.box.examen{background:var(--bxe);border-left:5px solid var(--bxec)}.box.examen>b:first-child{color:var(--bxec)}
.box.quiz{background:var(--okbg);border-left:5px solid var(--ok)}.box.quiz>b:first-child{color:var(--ok)}
.box.prof{background:var(--bxp);border:1.5px dashed var(--bxpc);border-left:5px solid var(--bxpc)}.box.prof>b:first-child{color:var(--bxpc);letter-spacing:.06em}.box.prof ul{margin:6px 0 4px 20px;padding:0}.box.prof p{margin:6px 0}.box.prof table.cmp{margin:8px 0;font-size:14.5px}
.box .btn{margin-top:10px}
figure.fig{margin:18px 0 24px;background:var(--fig);border:1px solid var(--line);border-radius:12px;padding:10px}
figure.fig svg{width:100%;height:auto;display:block}
figure.fig figcaption{font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.5;color:var(--mut);padding:10px 6px 2px;border-top:1px solid var(--soft);margin-top:8px}
figure.fig figcaption b{color:var(--acc)}
.replay{border:0;background:var(--lcob);color:var(--acc);font-weight:700;font-size:13px;border-radius:8px;padding:3px 9px;margin-left:6px;cursor:pointer;white-space:nowrap}
.bsec{scroll-margin-top:120px;padding-top:6px}.bsec+.bsec{margin-top:40px;padding-top:28px;border-top:3px double var(--line)}
.bsec .pk{font-family:'DM Sans',sans-serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ocre);font-weight:700}
article.book h1.ct{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(42px,6vw,62px);color:var(--ink);margin:0 0 6px;line-height:1}
.readbar{position:sticky;z-index:20;background:var(--rbar);backdrop-filter:blur(4px);border-bottom:1px solid var(--line);padding:8px 4px;margin:-6px 0 14px;font-size:14px;color:var(--mut);display:flex;justify-content:space-between;gap:10px}
.readbar b{color:var(--acc)}
.toc li ul{display:none}.toc li.act>ul{display:block}
article.book h3{scroll-margin-top:120px}
/* ===== animaciones (empiezan al entrar a la diapositiva) ===== */
figure.fig .fi,figure.fig .pp,figure.fig .gr,figure.fig .gy,figure.fig .sl,figure.fig .sr{opacity:0}
figure.fig .dr{stroke-dasharray:1;stroke-dashoffset:1}
figure.fig.on .fi{animation:fi .8s var(--d,0s) cubic-bezier(.2,.7,.2,1) both}
figure.fig.on .sl{animation:sl .8s var(--d,0s) cubic-bezier(.2,.7,.2,1) both}
figure.fig.on .sr{animation:sr .8s var(--d,0s) cubic-bezier(.2,.7,.2,1) both}
figure.fig.on .pp{animation:pp .6s var(--d,0s) cubic-bezier(.3,1.5,.5,1) both;transform-box:fill-box;transform-origin:center}
figure.fig.on .dr{animation:dr var(--t,1.4s) var(--d,0s) ease-in-out forwards}
figure.fig.on .gr{animation:gr .9s var(--d,0s) ease-out both;transform-box:fill-box;transform-origin:left center}
figure.fig.on .gy{animation:gy .9s var(--d,0s) ease-out both;transform-box:fill-box;transform-origin:center bottom}
figure.fig .fl{stroke-dasharray:12 10}
figure.fig.on .fl{animation:fl 1s linear infinite}
figure.fig .mv{opacity:0}
figure.fig.on .mv{animation:mv var(--t,3s) var(--d,0s) linear infinite}
figure.fig.on .mv1{animation:mv1 var(--t,2s) var(--d,0s) ease-in-out both}
figure.fig .mv1{opacity:0}
figure.fig.on .sp{animation:sp var(--t,4s) var(--d,0s) linear infinite;transform-box:fill-box;transform-origin:center}
figure.fig.on .pu{animation:pu 1.6s var(--d,0s) ease-in-out infinite;transform-box:fill-box;transform-origin:center}
figure.fig.on .wob{animation:wob 1.2s var(--d,0s) ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes fi{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes sl{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes sr{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes pp{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes gr{from{opacity:1;transform:scaleX(0)}to{opacity:1;transform:none}}
@keyframes gy{from{opacity:1;transform:scaleY(0)}to{opacity:1;transform:none}}
@keyframes fl{to{stroke-dashoffset:-22}}
@keyframes mv{0%{opacity:0;transform:translate(0,0)}10%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translate(var(--dx,0px),var(--dy,0px))}}
@keyframes mv1{from{opacity:0;transform:translate(var(--dx,0px),var(--dy,0px))}20%{opacity:1}to{opacity:1;transform:none}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@media (prefers-reduced-motion:reduce){figure.fig *{animation:none!important}figure.fig .fi,figure.fig .pp,figure.fig .gr,figure.fig .gy,figure.fig .sl,figure.fig .sr,figure.fig .mv1,figure.fig .mv{opacity:1!important}figure.fig .dr{stroke-dashoffset:0!important}}
figure.fig foreignObject table.tb{width:100%;border-collapse:collapse;font-size:19px;background:#fffdf7;color:#1d2340;border:2px solid var(--line);border-radius:12px}
figure.fig foreignObject .tb th{background:var(--cob);color:#fff;text-align:left;padding:8px 12px}
figure.fig foreignObject .tb td{padding:6px 12px;border-top:1px solid var(--soft)}
figure.fig foreignObject .tb td:first-child{font-weight:700;color:var(--acc2)}
.secnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:30px;padding-top:18px;border-top:2px solid var(--soft);font-family:"DM Sans",sans-serif}
/* ===== QUIZ ===== */
.qwrap{max-width:860px;margin:0 auto}
.qcard{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:clamp(16px,3vw,28px)}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:14px;color:var(--mut)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;padding:4px 9px;border-radius:12px;background:var(--soft);color:var(--ink)}
.tag.d1{background:var(--d1b);color:var(--d1c)}.tag.d2{background:var(--d2b);color:var(--d2c)}.tag.d3{background:var(--d3b);color:var(--d3c)}
.tag.t{background:var(--lcob);color:var(--acc)}
.qtext{font-size:20px;font-weight:600;line-height:1.45;margin:6px 0 16px}
.qsvg{background:var(--fig);border:1px solid var(--line);border-radius:12px;padding:8px;margin:0 0 14px;max-width:520px}
.qsvg svg{width:100%;height:auto;display:block}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:16px;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--hov)}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.sel{border-color:var(--acc);background:var(--selbg)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .L{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad .L{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fillin{display:flex;gap:8px;flex-wrap:wrap}.fillin input{flex:1;min-width:200px;font:inherit;font-size:17px;padding:11px 13px;border:2px solid var(--line);border-radius:10px;background:var(--paper)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--soft)}
.mrow b{font-weight:600}.mrow select{width:100%;font:inherit;font-size:15px;padding:9px;border:2px solid var(--line);border-radius:9px;background:var(--paper)}
.mrow.ok select{border-color:var(--ok);background:var(--okbg)}.mrow.bad select{border-color:var(--bad);background:var(--badbg)}
.olist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.olist li{display:flex;gap:10px;align-items:center;border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 10px}
.olist li .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--lcob);color:var(--acc);display:grid;place-items:center;font-weight:700;font-size:13px}
.olist li span.t{flex:1}
.olist li button{border:0;background:var(--soft);border-radius:7px;width:34px;height:30px;cursor:pointer;font-size:14px}
.olist li.ok{border-color:var(--ok);background:var(--okbg)}.olist li.bad{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:16px;border-radius:12px;padding:16px 18px;font-size:16px;line-height:1.55}
.fb.ok{background:var(--okbg);border:2px solid var(--okb)}.fb.bad{background:var(--badbg);border:2px solid var(--badb)}
.fb h4{margin:0 0 6px;font-size:18px}.fb.ok h4{color:var(--ok)}.fb.bad h4{color:var(--bad)}
.fb .ans{font-weight:700;margin:4px 0 8px}
.fb .why{margin-top:10px;display:grid;gap:7px}
.fb .why div{background:var(--whyb);border-radius:9px;padding:8px 11px;font-size:15px}
.fb .why div b.c{color:var(--ok)}.fb .why div b.x{color:var(--bad)}
.fb .corr{background:var(--paper);border-radius:9px;padding:8px 11px;margin-top:8px;border-left:4px solid var(--ok)}
.qnav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:16px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.stats div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stats b{display:block;font-size:22px;color:var(--acc)}.stats span{font-size:12px;color:var(--mut)}
.panel .row{margin-top:12px}
.setup{max-width:860px}
.setup fieldset{border:2px solid var(--line);border-radius:14px;background:var(--card);padding:14px 16px;margin:0 0 14px}
.setup legend{font-weight:700;color:var(--acc);padding:0 6px}
.setup label.ck{display:inline-flex;gap:6px;align-items:center;margin:4px 12px 4px 0;font-size:15px}
.setup select{font:inherit;padding:9px;border:2px solid var(--line);border-radius:9px;background:var(--paper);max-width:100%}
.egrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.egrid button{width:36px;height:34px;border-radius:8px;border:2px solid var(--line);background:var(--paper);font-weight:700;cursor:pointer;font-size:13px}
.egrid button.a{background:var(--lcob);border-color:var(--acc);color:var(--acc)}
.egrid button.cur{outline:3px solid var(--ocre)}
.res-big{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.res-big .cal{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:72px;font-weight:600;color:var(--acc);line-height:1}
.err{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.err .q{font-weight:600;margin:4px 0 8px}
.err .ga{font-size:15px}.err .ga .x{color:var(--bad);font-weight:700}.err .ga .c{color:var(--ok);font-weight:700}
.muted{color:var(--mut)}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--mut)}
.tbl2{width:100%;border-collapse:collapse;font-size:15px}.tbl2 th,.tbl2 td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}

<script>
"use strict";
const $=s=>document.querySelector(s);
const app=$('#app');
const T=window.TEMAS, SUB=window.SUBTEMAS, LIB=window.LIBRO, BANCO=window.BANCO, CONC=window.CONCEPTOS, SEQ=window.SECUENCIAS;
const TIPO={mc:'Opción múltiple',tf:'Verdadero o falso',fill:'Completar',match:'Relacionar columnas',order:'Ordenar',id:'Identificar estructura'};
const DIFN={1:'🟢 Básica',2:'🟡 Intermedia',3:'🔴 Avanzada'};
const LET='ABCDEFGH';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return (h>>>0).toString(36)}
// ---------- almacenamiento (por navegador) ----------
const KEY='bc-plataforma-v1';
let ST={seen:{},errs:{},read:{},log:{},marks:{},notes:{}};
try{const r=localStorage.getItem(KEY);if(r)ST=Object.assign(ST,JSON.parse(r))}catch(e){}
ST.log=ST.log||{};ST.marks=ST.marks||{};ST.notes=ST.notes||{};if(!ST.since){ST.since=Date.now();try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}updBadge()}
function updBadge(){$('#nerr').textContent=Object.keys(ST.errs).length}
function markSeen(q){const s=(ST.seen[q.tema]=ST.seen[q.tema]||[]);if(!s.includes(q.id))s.push(q.id)}
function addErr(q,given){const e=ST.errs[q.id]||{n:0};e.q=q;e.given=given;e.n++;e.when=Date.now();ST.errs[q.id]=e}
function delErr(id){delete ST.errs[id]}
// registro de cada respuesta (para calcular el dominio): últimos 6 resultados por pregunta
function logAns(q,ok){if(!q||!q.id||!q.tema)return;const e=ST.log[q.id]||{t:q.tema,s:q.sub,c:q.con||null,h:[],n:0};e.h.push(ok?1:0);if(e.h.length>6)e.h=e.h.slice(-6);e.n++;e.last=Date.now();if(!ok)e.lastBad=e.last;if(!e.c&&q.con)e.c=q.con;ST.log[q.id]=e}
// ---------- generador de variantes ----------
function genQ(tema,sub,fx,tyF){
  const facts=CONC[tema].filter(f=>!sub||f[2]===sub);
  const all=CONC[tema];
  const types=['mcT','mcT','mcD','tf','tf','fill','match','order'];
  for(let tries=0;tries<30;tries++){
    const ty=tyF||pick(types);
    if(ty==='order'){const seqs=SEQ[tema].filter(s=>!sub||s[2]===sub);if(!seqs.length)continue;const s=pick(seqs);
      return {id:'g-'+tema+'-o-'+hash(s[0]),tema,sub:s[2],tipo:'order',dif:2,cat:'Mecanismo',q:s[0],items:s[1],exp:'Orden correcto: '+s[1].join(' → ')+'.',gen:1}}
    if(!facts.length)return null;
    const f=fx||pick(facts);
    let same=all.filter(g=>g[3]===f[3]&&g[0]!==f[0]);
    if(same.length<3)same=same.concat(shuffle(all.filter(g=>g[3]!==f[3]&&g[0]!==f[0])).slice(0,3-same.length));
    const ds=shuffle(same).slice(0,3);
    const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
    if(ty==='mcT')return {id:'g-'+tema+'-t-'+hash(f[0]+ds.map(d=>d[0]).join()),tema,sub:f[2],tipo:'mc',dif:1,cat:'Concepto',gen:1,con:f[0],
      q:'¿Qué término corresponde a la siguiente descripción?\n«'+cap(f[1])+'»',opts:[f[0]].concat(ds.map(d=>d[0])),
      why:['Correcta: '+f[0]+' — '+f[1]+'.'].concat(ds.map(d=>'Incorrecta: '+d[0]+' — '+d[1]+'.')),exp:f[0]+': '+f[1]+'.'};
    if(ty==='mcD')return {id:'g-'+tema+'-d-'+hash(f[0]+'d'+ds.map(d=>d[0]).join()),tema,sub:f[2],tipo:'mc',dif:2,cat:'Comprensión',gen:1,con:f[0],
      q:'¿Qué describe mejor a: '+f[0]+'?',opts:[cap(f[1])].concat(ds.map(d=>cap(d[1]))),
      why:['Correcta: es la descripción de '+f[0]+'.'].concat(ds.map(d=>'Incorrecta: describe a '+d[0]+'.')),exp:f[0]+': '+f[1]+'.'};

function pool(temas,o){return BANCO.filter(q=>temas.includes(q.tema)&&(!o.sub||q.sub===o.sub)&&(!o.dif||q.dif===o.dif)&&(!o.tipos||o.tipos.includes(q.tipo)))}
function build(temas,n,o){
  o=o||{};const out=[],used=new Set(o.exclude||[]);
  const per={};temas.forEach((t,i)=>per[t]=Math.floor(n/temas.length)+(i<n%temas.length?1:0));
  for(const t of temas){
    const need=per[t];if(!need)continue;
    const P=pool([t],o).filter(q=>!used.has(q.id));
    const ratio=o.gen===false?0:(o.genRatio==null?.2:o.genRatio);
    const handTarget=Math.min(P.length,need-Math.round(need*ratio));
    let seen=new Set(ST.seen[t]||[]);
    let cand=P.filter(q=>!seen.has(q.id));
    if(cand.length<handTarget){ // ciclo completo: se reinicia lo visto de este conjunto
      const ids=new Set(P.map(q=>q.id));ST.seen[t]=(ST.seen[t]||[]).filter(id=>!ids.has(id));save();
      cand=cand.concat(shuffle(P.filter(q=>seen.has(q.id))));
    }
    // mezcla de dificultades ≈ 35 % básica, 40 % intermedia, 25 % avanzada
    const byD={1:shuffle(cand.filter(q=>q.dif===1)),2:shuffle(cand.filter(q=>q.dif===2)),3:shuffle(cand.filter(q=>q.dif===3))};
    const tg={1:Math.round(handTarget*.35),2:Math.round(handTarget*.4)};tg[3]=handTarget-tg[1]-tg[2];
    const sel=[];[1,2,3].forEach(d=>sel.push(...byD[d].splice(0,Math.max(0,tg[d]))));
    const rest=shuffle(byD[1].concat(byD[2],byD[3]));while(sel.length<handTarget&&rest.length)sel.push(rest.shift());

  }

}

  const sub=(same[0]&&same[0].sub)||(facts[0]&&facts[0][2])||null;const near=sub?BANCO.filter(q=>q.tema===t&&q.sub===sub&&!same.includes(q)):[];

  h+=sec('🎞️ Presentaciones',G.diapo.length,lim(G.diapo).map(x=>`<a class="sres" href="${x.href}" target="_self"><b>${esc(x.tit)}</b><span>${snip(x.tx,words)}</span></a>`).join(''));
  h+=sec('🧠 Preguntas',G.preg.length,lim(G.preg).map((x,j)=>`<button class="sres" type="button" data-qi="${esc(x.q.id)}"><b>${esc(T[x.q.tema])} · ${esc(SUB[x.q.tema][x.q.sub]||'')}</b><span>${snip(x.q.q,words)}</span></button>`).join(''));
  h+=sec('❌ Mis errores',errs.length,lim(errs).map(e=>`<a class="sres" href="#errores-${e.q.tema}"><b>${esc(T[e.q.tema])}</b><span>${snip(e.q.q,words)}</span></a>`).join(''));
  h+=sec('📝 Mis notas',notes.length,lim(notes).map(({N,x})=>`<a class="sres" href="#libro-${N.t}-${N.k}-${N.h}"><b>${esc(N.tit)}</b><span>${snip(x.txt,words)}</span></a>`).join(''));
  $('#bres').innerHTML=h;
  $('#bres').querySelectorAll('[data-qi]').forEach(b=>b.onclick=()=>{const qq=QI[b.dataset.qi];startPractice({tema:qq.tema,sub:'',n:1},[qq])});
}
// ---------- TENGO EXAMEN MAÑANA ----------
let FIGLOC=null;
function figLocs(){if(FIGLOC)return FIGLOC;FIGLOC={};Object.entries(LIB).forEach(([t,L])=>L.secciones.forEach((s,k)=>s.html.split('<h3>').forEach((part,j)=>{(part.match(/data-f="[\w.]+"/g)||[]).forEach(m=>{const f=m.slice(8,-1);if((M.PASOS||{})[f])(FIGLOC[t]=FIGLOC[t]||[]).push({f,k,h:j-1,tit:j?s.subs[j-1]:s.titulo})})})));return FIGLOC}
function vPlan(){
  app.innerHTML=`<div class="setup"><div class="kick">Panel</div><h1 class="pt">🚨 Tengo examen mañana</h1><p class="lead2">Elige los temas y el tiempo que tienes. La ruta prioriza: conceptos débiles → errores frecuentes → alto rendimiento → mecanismos fundamentales → preguntas → repaso final.</p>
  <fieldset><legend>Temas del examen</legend>${Object.entries(T).map(([k,v])=>`<label class="ck"><input type="checkbox" value="${k}"> ${esc(v)}</label>`).join('')}</fieldset>
  <fieldset><legend>Tiempo disponible</legend><div class="chips" id="ptm">${[[30,'30 min'],[60,'1 h'],[90,'1 h 30'],[120,'2 h'],[180,'3 h'],[240,'4 h']].map(([v,l])=>`<button class="chip ${v===120?'on':''}" data-v="${v}">${l}</button>`).join('')}</div></fieldset>
  <div class="row"><button class="btn" id="pgo">Generar mi ruta</button></div><div id="pres"></div></div>`;
  app.querySelectorAll('#ptm .chip').forEach(b=>b.onclick=()=>{app.querySelectorAll('#ptm .chip').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
  $('#pgo').onclick=()=>{const temas=[...app.querySelectorAll('fieldset input:checked')].map(x=>x.value);if(!temas.length){alertInline(app.querySelector('.setup'),'Elige al menos un tema.');return}planHTML(temas,+app.querySelector('#ptm .on').dataset.v)};
}
function planHTML(temas,min){
  const WC=PR.weakConcepts(ST,temas),WS=PR.weakSubs(ST,temas,SUB);
  const EG={};Object.values(ST.errs).forEach(e=>{const q=QI[e.q.id]||e.q;if(!temas.includes(q.tema))return;const k=q.tema+'|'+(q.con||('§'+q.sub));const g=EG[k]||(EG[k]={t:q.tema,s:q.sub,c:q.con||'',n:0});g.n+=e.n||1});
  const EL=Object.values(EG).sort((a,b)=>b.n-a.n);
  let b1=Math.round(min*.2),b2=Math.round(min*.3),b3=Math.round(min*.15),b4=Math.round(min*.25),b5=min-b1-b2-b3-b4;
  const weakItems=[];const seen=new Set();WC.forEach(g=>{const k=g.t+'|'+g.c;if(!seen.has(k)){seen.add(k);weakItems.push({g,why:`${g.x} de ${g.y} preguntas falladas`})}});EL.forEach(g=>{const k=g.t+'|'+g.c;if(!seen.has(k)){seen.add(k);weakItems.push({g,why:`fallado ${g.n} ${g.n===1?'vez':'veces'}`})}});
  const nW=Math.min(weakItems.length,Math.max(2,Math.round(b1/6)));
  if(!weakItems.length){b2+=b1;b1=0}
  // alto rendimiento: lectura a ≈180 palabras/min
  const R=[];temas.forEach(t=>{const imp=(M.IMP||{})[t]||{};Object.entries(imp).forEach(([key,v])=>{if(v!=='r')return;const [k,h]=key.split('.').map(Number);const hh=isNaN(h)?-1:h;const w=isNaN(h)?Object.entries(M.HW[t]).filter(([kk])=>kk.split('.')[0]==k).reduce((a,[,x])=>a+x,0):(M.HW[t][k+'.'+h]||200);
    const weak=WS.some(x=>x.t===t&&M.SUBLOC[t][x.s]&&M.SUBLOC[t][x.s][0]===k&&(isNaN(h)||M.SUBLOC[t][x.s][1]===h));const alto=isNaN(h)&&/alto rendimiento/i.test(LIB[t].secciones[k].titulo);
    R.push({t,k,h:hh,tit:isNaN(h)?LIB[t].secciones[k].titulo:LIB[t].secciones[k].subs[h],min:Math.max(2,Math.round(w/180)),pri:alto?0:weak?1:2})})});
  R.sort((a,b)=>a.pri-b.pri||a.t.localeCompare(b.t)||a.k-b.k||a.h-b.h);
  let used=0;const RS=[],RX=[];R.forEach(x=>{if(used+x.min<=b2||!RS.length){RS.push(x);used+=x.min}else RX.push(x)});
  const F=[];temas.forEach(t=>(figLocs()[t]||[]).forEach(x=>F.push(Object.assign({t},x))));const nF=Math.max(1,Math.floor(b3/3));const FS=F.slice(0,nF);
  const nQ=Math.max(5,Math.round(b4/1.1));
  const li=(href,txt,extra)=>`<li><label><input type="checkbox"> <a href="${href}">${txt}</a></label>${extra?` <span class="muted">${extra}</span>`:''}</li>`;
  const blk=(n,tt,m,body)=>`<div class="cpanel plan"><h3><span class="bn">${n}</span> ${tt} <span class="muted">≈ ${m} min</span></h3>${body}</div>`;
  let h=`<h2 style="color:var(--acc);margin:22px 0 4px">Tu ruta para ${min>=60?(min/60).toString().replace('.',',')+' h':min+' min'}</h2><p class="muted" style="margin:0 0 10px">${temas.map(t=>T[t]).join(' · ')}. Marca cada paso al terminarlo.${!WC.length&&!EL.length?' Aún no hay errores ni conceptos débiles registrados, así que el tiempo del bloque 1 pasa al alto rendimiento.':''}</p>`;
  if(b1)h+=blk(1,'Conceptos débiles y errores frecuentes',b1,`<ol class="pl">${weakItems.slice(0,nW).map(({g,why})=>li(studyHref({tema:g.t,con:g.c,sub:g.s}),'📖 '+esc(conLabel(g.t,g.c,g.s)),`${esc(T[g.t])} · ${why} · <a href="${practHref(g.t,g.c,g.s)}">🧠 practicar</a>`)).join('')}</ol>`);
  h+=blk(2,'🔴 Alto rendimiento',b2,`<ol class="pl">${RS.map(x=>li(`#libro-${x.t}-${x.k}-${x.h}`,esc(x.tit),`${esc(T[x.t])} · ≈${x.min} min${x.pri===1?' · subtema débil':''}`)).join('')}</ol>${RX.length?`<details><summary>Si te sobra tiempo (${RX.length} más)</summary><ol class="pl">${RX.map(x=>li(`#libro-${x.t}-${x.k}-${x.h}`,esc(x.tit),`${esc(T[x.t])} · ≈${x.min} min`)).join('')}</ol></details>`:''}<p class="muted" style="font-size:13px">En el libro puedes activar «🔴 Solo alto rendimiento» para leer únicamente estos bloques.</p>`);
  h+=blk(3,'Mecanismos fundamentales, paso a paso',b3,FS.length?`<ol class="pl">${FS.map(x=>li(`#libro-${x.t}-${x.k}-${x.h}`,'▶ '+esc(x.tit),esc(T[x.t])+' · usa «Siguiente ▶» en la figura')).join('')}</ol>`:'<p class="muted">No hay animaciones paso a paso en estos temas.</p>');
  h+=blk(4,'Preguntas',b4,`<p style="margin:0 0 8px">${nQ} preguntas con retroalimentación${WS.length||WC.length?', con prioridad en tus puntos débiles':''}.</p><button class="btn" id="pq4">🧠 Empezar las preguntas</button> <a class="btn sec" href="#examen">📝 O un simulador sin ayudas</a>`);
  h+=blk(5,'Repaso final',b5,`<ol class="pl">${temas.map(t=>{const S=LIB[t].secciones;const ie=S.findIndex(s=>/errores frecuentes/i.test(s.titulo)),ir=S.findIndex(s=>/resumen/i.test(s.titulo));return (ie>=0?li(`#libro-${t}-${ie}`,'Errores frecuentes · '+esc(T[t])):'')+(ir>=0?li(`#libro-${t}-${ir}`,'Resumen final · '+esc(T[t])):'')}).join('')}${EL.length?li('#errores','❌ Repasar mis errores pendientes'):''}</ol>`);
  $('#pres').innerHTML=h;$('#pres').scrollIntoView({behavior:'smooth',block:'start'});
  $('#pq4').onclick=()=>{const L=[],u=new Set();const add=q=>{if(q&&!u.has(q.id)&&L.length<nQ){u.add(q.id);L.push(q)}};
    WC.slice(0,5).forEach(g=>reinforceList(g.t,g.c).out.slice(0,2).forEach(add));WS.forEach(w=>build([w.t],3,{sub:w.s,genRatio:0}).forEach(add));
    build(temas,nQ,{genRatio:.1,exclude:[...u]}).forEach(add);startPractice({tema:temas.length===1?temas[0]:'',temas,plan:1,gen:true},shuffle(L))};
}
// ---------- GUARDADOS ----------
function vGuardados(){
  const MK=Object.entries(ST.marks).sort((a,b)=>b[1].when-a[1].when),NT=Object.entries(ST.notes).sort((a,b)=>Math.max(...b[1].items.map(x=>x.when))-Math.max(...a[1].items.map(x=>x.when)));
  app.innerHTML=`<div class="qwrap"><div class="kick">Panel</div><h1 class="pt">🔖 Mis conceptos guardados</h1><p class="lead2">Guarda un apartado con 🔖 o escribe una nota con 📝 junto a cualquier encabezado del libro.</p>
  <div class="cpanel"><h3>🔖 Guardados (${MK.length})</h3>${MK.length?MK.map(([k,m])=>`<div class="wrow"><div><a href="#libro-${m.t}-${m.k}-${m.h}"><b>${esc(m.tit)}</b></a><div class="muted" style="font-size:13px">${esc(T[m.t])} · ${esc(LIB[m.t].secciones[m.k].titulo)} · ${fdate(m.when)}</div></div><div class="acts"><button type="button" class="lnk" data-um="${esc(k)}">Quitar</button></div></div>`).join(''):'<p class="muted">Aún no has guardado nada.</p>'}</div>
  <div class="cpanel"><h3>📝 Mis notas (${NT.reduce((a,[,n])=>a+n.items.length,0)})</h3>${NT.length?NT.map(([k,n])=>`<div class="wrow" style="display:block"><a href="#libro-${n.t}-${n.k}-${n.h}"><b>${esc(n.tit)}</b></a> <span class="muted" style="font-size:13px">${esc(T[n.t])}</span>${n.items.map(x=>`<div class="note">${esc(x.txt).replace(/\n/g,'<br>')}<div class="muted" style="font-size:12px">${fdate(x.when)}</div></div>`).join('')}</div>`).join(''):'<p class="muted">Aún no has escrito notas.</p>'}</div></div>`;
  app.querySelectorAll('[data-um]').forEach(b=>b.onclick=()=>{delete ST.marks[b.dataset.um];persist();vGuardados()});
}
// ---------- VISUALIZACIONES ----------
function vVisual(k){const L=(window.VIZ&&window.VIZ.list)||{};if(!L[k])k='';
  app.innerHTML=`<div class="qwrap" style="max-width:1100px"><div class="kick">Panel</div><h1 class="pt">🔬 Visualizaciones interactivas</h1><div class="chips" style="margin-bottom:14px">${Object.entries(L).map(([id,n])=>`<a class="chip ${id===k?'on':''}" href="#visual-${id}">${esc(n)}</a>`).join('')}</div><div id="vzh">${k?'':'<p class="muted">Elige una visualización. También aparecen dentro de los capítulos de Regulación génica y Señalización celular.</p>'}</div></div>`;
  if(k)window.VIZ.mount($('#vzh'),k,{})}
// ---------- MAPAS CONCEPTUALES ----------
function mapSVG(t){const Mp=M.MAPAS[t];const W=190,H=50;const P={};Mp.n.forEach(n=>P[n[0]]=n);
  const wrap=s=>{if(s.length<=22)return [s];const w=s.split(' ');let a='';const out=[];w.forEach(x=>{if((a+' '+x).trim().length>22&&a){out.push(a);a=x}else a=(a+' '+x).trim()});out.push(a);return out.slice(0,2)};
  let e='',lb='',nd='';Mp.e.forEach(([a,b,l])=>{const A=P[a],B=P[b];e+=`<line x1="${A[2]}" y1="${A[3]}" x2="${B[2]}" y2="${B[3]}" class="me"/>`;if(l){const x=(A[2]+B[2])/2,y=(A[3]+B[3])/2,w=l.length*6.6+10;lb+=`<rect x="${x-w/2}" y="${y-9}" width="${w}" height="18" rx="5" class="mlb"/><text x="${x}" y="${y+4}" class="mlt">${esc(l)}</text>`}});
  Mp.n.forEach(([id,lab,x,y,k,h])=>{const ls=wrap(lab);nd+=`<a href="#libro-${t}-${k}-${h}"><g class="mn"><rect x="${x-W/2}" y="${y-H/2}" width="${W}" height="${H}" rx="11"/>${ls.map((s,j)=>`<text x="${x}" y="${y+5+(j-(ls.length-1)/2)*16}">${esc(s)}</text>`).join('')}</g></a>`});
  return `<svg viewBox="0 0 790 520" class="cmap" role="img" aria-label="Mapa conceptual de ${esc(T[t])}">${e}${lb}${nd}</svg>`}
function vMapa(t){
  app.innerHTML=`<div class="qwrap" style="max-width:980px"><div class="kick">Panel</div><h1 class="pt">🗺️ Mapa conceptual</h1><div class="chips" style="margin-bottom:12px">${Object.keys(T).map(k=>`<a class="chip ${k===t?'on':''}" href="#mapa-${k}">${esc(T[k])}</a>`).join('')}</div>
  ${t?`<div class="cpanel">${mapSVG(t)}<p class="muted" style="font-size:14px;margin:8px 0 0">Toca un concepto para ir a su sección del libro. <a href="#libro-${t}">Índice del capítulo</a></p></div>`:'<p class="muted">Elige un tema.</p>'}</div>`;
}

document.querySelectorAll('.nav a[data-r]').forEach(a=>a.addEventListener('click',e=>{if(location.hash===a.getAttribute('href')){e.preventDefault();route()}}));
updBadge();route();
